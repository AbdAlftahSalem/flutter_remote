# End-to-end tests on every push and pull request. All of them run real
# processes: the CLI binary, the gate, the WebRTC peer, a synthetic serve-sim
# (FFmpeg test video) and a real headless Google Chrome. No mocks.
# The iOS Simulator part lives in e2e-runner.yml (manual, macOS).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-linux:
    name: E2E (Linux, Node ${{ matrix.node }}) — CLI, scaffold, gate, browser stream
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: google-chrome --version
      - run: npm test

  e2e-windows:
    name: E2E (Windows) — CLI, scaffold, gate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:cli
      - run: npm run test:gate
